[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "voice-integration"
description = "Voice control plane: OpenAI Realtime voice in front of a Hermes gateway that orchestrates coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.13", "mypy>=1.11"]

# The bridge itself depends on nothing: it sits between a paid audio stream and
# an agent swarm, and every package in that path is a way in. The audio client
# that will need more is decisions/deferred.md's first row.
[project.scripts]
voicebridge = "voice_bridge.cli:run"

# One source for the version: the Git tag. A literal here would drift from it.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/voice_bridge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_bridge"]
# py.typed tells a consumer's type checker that these annotations are meant.
artifacts = ["src/voice_bridge/py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# D203/D213 contradict D211/D212, which are kept; COM812 and ISC001 fight the
# formatter; CPY001 wants a header in every file, and the licence is one file;
# D401 wants an imperative first line, but a command's docstring is also its
# help text, and help reads as a description. N818 wants every exception named
# with an Error suffix; `raise Refused(...)` and `except Disagreement` read as
# the sentences they are, and the names are in the documented output.
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "CPY001", "D401", "N818"]

[tool.ruff.lint.per-file-ignores]
# A command-line tool prints; that is its output channel, not a stray debug line.
"src/voice_bridge/cli.py" = ["T201"]
# A test's name is its docstring, its fixtures need no annotations, and a bare
# assert is the point of pytest.
"tests/*" = ["S101", "ANN", "D1", "PLR2004", "INP001", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["voice_bridge"]
omit = ["*/_version.py"]   # generated from the Git tag at build time

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
