# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/voice_bridge/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "a voice session may only call a tool it was given"
file = "src/voice_bridge/policy.py"
find = 'if name not in self\.tools:'
replace = 'if False:'

[[rule]]
name = "an approval answered by voice binds one call only"
file = "src/voice_bridge/policy.py"
find = 'if choice not in SPOKEN_APPROVAL_CHOICES:'
replace = 'if False:'

[[rule]]
name = "a spoken reply is capped, so audio never carries a transcript"
file = "src/voice_bridge/speech.py"
find = 'if len\(collapsed\) <= SPOKEN_REPLY_MAX_CHARS:'
replace = 'if True:'

[[rule]]
name = "a path argument goes into the URL, never into the body"
file = "src/voice_bridge/gateway.py"
find = 'path = path\.replace\(placeholder'
replace = 'path = path  # mutated'

[[rule]]
name = "a required argument missing is refused before a request is planned"
file = "src/voice_bridge/gateway.py"
find = 'if missing:'
replace = 'if False:'

[[rule]]
name = "only an HTTP gateway URL is ever opened"
file = "src/voice_bridge/gateway.py"
find = 'if not request\.url\.startswith\(_ALLOWED_SCHEMES\):'
replace = 'if False:'

[[rule]]
name = "a gateway refusal is spoken, not raised"
file = "src/voice_bridge/speech.py"
# Two rules share this line and mutate it differently: switch the whole test
# off and no refusal is ever spoken; widen it back and a failed run is called
# a refusal again.
find = 'if "error" in payload and "object" not in payload:'
replace = 'if False:'

[[rule]]
name = "a refused call says why and exits non-zero"
file = "src/voice_bridge/cli.py"
find = '^        return 2$'
replace = 'return 0'

[[rule]]
name = "a run that failed is not a refused request"
file = "src/voice_bridge/speech.py"
find = 'if "error" in payload and "object" not in payload:'
replace = 'if "error" in payload:'

[[rule]]
name = "a session is refused once the monthly ceiling is spent"
file = "src/voice_bridge/budget.py"
find = 'if self\.remaining_usd\(\) <= 0:'
replace = 'if False:'

[[rule]]
name = "the month is checked before a session is opened"
file = "src/voice_bridge/live.py"
find = '\(ledger or Ledger\(\)\)\.authorise\(\)'
replace = 'pass'

[[rule]]
name = "a session is never opened without a language rule in its own language"
file = "src/voice_bridge/live.py"
# `if False:` rather than an early return: a replacement has to leave the file
# valid, and returning here orphans the two lines under it into a syntax error,
# which turns every test red and proves nothing about this rule.
find = 'if chosen not in INSTRUCTIONS:'
replace = 'if False:'

[[rule]]
name = "a delegation waits for the work rather than reading back a receipt"
file = "src/voice_bridge/server.py"
find = 'finished = gateway\.wait_for'
replace = 'finished = started'

[[rule]]
name = "a voice turn asks the gateway to finish inside it"
file = "src/voice_bridge/server.py"
find = 'asking = replace\(planned'
replace = 'asking = planned'

[[rule]]
name = "only a word that is plainly yes or no answers a permission question"
file = "src/voice_bridge/server.py"
find = 'if answered is not None:'
replace = 'if True:'

[[rule]]
name = "a permission question is noticed however late it arrives"
file = "src/voice_bridge/server.py"
find = 'if str\(event\.get\("event", ""\)\)\.startswith\("approval\.request"\):'
replace = 'if False:'

[[rule]]
name = "a remembered turn is a message item, not a bare string"
file = "src/voice_bridge/server.py"
find = '"type": "message",'
replace = '"type": "message", "content": text.strip(),'

[[rule]]
name = "a turn is finished only when the run behind it is"
file = "src/voice_bridge/server.py"
find = 'bridge\.following = str\(run_id\) if still_running\(finished\) else None'
replace = 'bridge.following = None'

[[rule]]
name = "separate things said stay separate when they are sent on"
file = "src/voice_bridge/server.py"
find = 'said = \[line\.strip\(\) for line in transcript\.splitlines\(\) if line\.strip\(\)\]'
replace = 'said = [" ".join(transcript.split())]'

[[rule]]
name = "an open microphone is booked while it is open"
file = "src/voice_bridge/server.py"
find = 'self\.server\.ledger\.record\(float\(body\.get\("seconds", 0\)\)\)'
replace = 'pass'

[[rule]]
name = "a phrase the gateway demanded is said for the person, not by them"
file = "src/voice_bridge/server.py"
find = 'transcript, bridge\.demanded = bridge\.demanded, None'
replace = 'bridge.demanded = None'

[[rule]]
name = "a request carries the conversation it came out of"
file = "src/voice_bridge/server.py"
find = 'carrying\["conversation_history"\] = bridge\.context\(\)'
replace = 'carrying.pop("conversation_history", None)'

[[rule]]
name = "a question the bridge can answer never travels further"
file = "src/voice_bridge/server.py"
find = 'if immediate is not None:'
replace = 'if False:'

[[rule]]
name = "only a short question is ever answered without the gateway"
file = "src/voice_bridge/quick.py"
find = 'if len\(said\) > SHORTEST_IS_SAFEST:'
replace = 'if False:'

[[rule]]
name = "a question for the web is asked of the web, not of an agent"
file = "src/voice_bridge/quick.py"
find = 'return on_the_web\(transcript\.strip\(\)\)'
replace = 'return None'

[[rule]]
name = "a position is held in memory and written nowhere"
file = "src/voice_bridge/server.py"
find = 'self\.server\.placed = quick\.place_of\('
replace = 'self.server.placed = None; _ = ('

[[rule]]
name = "the page may only report events in its own name"
file = "src/voice_bridge/server.py"
find = 'if reported not in PAGE_EVENTS:'
replace = 'if False:'
