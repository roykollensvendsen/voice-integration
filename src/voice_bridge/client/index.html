<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>voice-bridge</title>
<style>
  :root { color-scheme: light dark; --ink: #17181c; --dim: #6c7079; --line: #d7d9de; --live: #1a7f4b; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e9eaee; --dim: #9aa0aa; --line: #33363d; --live: #4ed58c; }
  }
  body { margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
         font: 15px/1.55 ui-sans-serif, system-ui, sans-serif; color: var(--ink);
         background: Canvas; max-width: 76rem; margin-inline: auto; }

  /* Wide: the conversation on the left, the agents on the right, side by side.
     Narrow: the same two panes, one screen each, swiped between. Scroll snap
     does the swiping, so there is no gesture code to get wrong. */
  #panes { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; align-items: start; }
  .pane { min-width: 0; }
  #tabs { display: none; gap: .4rem; margin: 1.5rem 0 0; }
  #tabs button { padding: .4rem .9rem; font-size: .85rem; border-radius: 999px; }
  #tabs button[aria-current="true"] { border-color: var(--live); color: var(--live); }

  @media (max-width: 54rem) {
    #tabs { display: flex; }
    #panes { display: flex; grid-template-columns: none; gap: 0;
             overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
             margin-inline: -16px; scroll-behavior: smooth; overscroll-behavior-x: contain; }
    #panes::-webkit-scrollbar { display: none; }
    .pane { flex: 0 0 100%; scroll-snap-align: start; padding-inline: 16px; }
    .pane h2 { margin-top: 1rem; }
  }
  h1 { font-size: 1rem; font-weight: 600; letter-spacing: .01em; margin: 0 0 .25rem; }
  p.sub { color: var(--dim); margin: 0 0 1.5rem; }
  button { font: inherit; padding: .7rem 1.4rem; border-radius: 999px; border: 1px solid var(--line);
           background: transparent; color: inherit; cursor: pointer; }
  button[data-live="yes"] { border-color: var(--live); color: var(--live); }
  #state { margin-left: .9rem; color: var(--dim); }
  #log { border-top: 1px solid var(--line); }
  h2 { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
       color: var(--dim); margin: 2.25rem 0 .5rem; }
  #under { border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  #under { border-top: 1px solid var(--line); padding-top: .6rem; max-height: 60vh; overflow-y: auto; }
  .ev { padding: .2rem 0 .2rem 1.1rem; position: relative; font-size: .85rem; line-height: 1.5; }
  .ev::before { content: "\2022"; position: absolute; left: 0; color: var(--dim); }
  .ev[data-kind="tool.started"]::before, .ev[data-kind="run.asked"]::before { color: var(--live); }
  .ev .kind { font-weight: 600; }
  .ev .what { color: var(--dim); overflow-wrap: anywhere; white-space: pre-wrap; }
  .ev[data-asking] { background: color-mix(in srgb, var(--live) 12%, transparent);
        margin-inline: -.5rem; padding-inline: 1.6rem .5rem; border-radius: .3rem; }
  .ev .answer { display: flex; gap: .5rem; margin-top: .45rem; }
  .ev .answer button { padding: .25rem .9rem; font-size: .8rem; }
  #log { max-height: 60vh; overflow-y: auto; }
  .turn { padding: .7rem 0; border-bottom: 1px solid var(--line); display: grid;
          grid-template-columns: 5.5rem 1fr; gap: .8rem; }
  .turn[data-who="You"] .who { color: var(--ink); font-weight: 600; }
  .newer { display: flex; align-items: center; gap: .7rem; color: var(--dim); font-size: .75rem;
           text-transform: uppercase; letter-spacing: .08em; padding: 1rem 0 .2rem; }
  .newer::before, .newer::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .turn .what { overflow-wrap: anywhere; }
  @media (max-width: 34rem) { .turn { grid-template-columns: 1fr; gap: .15rem; } }
  .who { color: var(--dim); font-size: .8rem; letter-spacing: .02em; padding-top: .15rem; }
</style>

<h1>voice-bridge</h1>
<p class="sub">Talk to your coding agents. Nothing is listening until you press the button.</p>

<button id="talk">Take the microphone</button><span id="state">idle</span>

<nav id="tabs" aria-label="Which side to show">
  <button type="button" data-pane="0" aria-current="true">The conversation</button>
  <button type="button" data-pane="1">Underneath</button>
</nav>

<div id="panes">
  <section class="pane">
    <h2>The conversation</h2>
    <p class="sub">What was actually said out loud, by you and by it.</p>
    <div id="log"></div>
  </section>
  <section class="pane">
    <h2>Underneath</h2>
    <p class="sub">What the agents did to answer. The voice never reads this out — that is what it is for.</p>
    <div id="under"></div>
  </section>
</div>

<script type="module">
const talk = document.getElementById("talk");
const under = document.getElementById("under");
const panes = document.getElementById("panes");
const tabs = [...document.querySelectorAll("#tabs button")];

// The tabs follow the swipe rather than driving it, so a finger and a click
// cannot disagree about which side is showing.
tabs.forEach((tab, i) => {
  tab.onclick = () => panes.children[i].scrollIntoView({ inline: "start", block: "nearest" });
});
panes.onscroll = () => {
  const showing = Math.round(panes.scrollLeft / Math.max(1, panes.clientWidth));
  tabs.forEach((tab, i) => tab.setAttribute("aria-current", String(i === showing)));
};
const state = document.getElementById("state");
const log = document.getElementById("log");

let pc = null, channel = null, holding = "";

// The ceiling only means something if somebody counts. Nothing did: the ledger
// had a rule, a test and a mutation row, and no caller — so it always read
// empty and could never refuse. A session reports while it is open rather than
// only when it closes, because a tab that is closed abruptly reports nothing.
const BOOK_EVERY_MS = 60_000;
let booked = null, booking = null;

async function book() {
  if (booked === null) return;
  const seconds = Math.max(0, Math.round((Date.now() - booked) / 1000));
  if (seconds < 1) return;
  booked = Date.now();
  const left = await fetch("/spent", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ seconds }),
  }).then((r) => r.json()).catch(() => null);
  if (left) state.textContent = `listening · $${left.remaining_usd.toFixed(2)} left`;
}

// Transcript fragments carry start_ms and end_ms on the session timeline, and
// there is no turn-completed event: the guide says so outright and tells you to
// group by gap and keep the grouping revisable. So a turn is a run of fragments
// from one speaker with no long silence in it, and a late fragment still lands
// in the row it belongs to.
const TURN_GAP_MS = 1200;

// How long an answer has to arrive before the voice says it is working on it.
const HOLD_AFTER_MS = 600;
const turns = [];      // {who, text, start, end, row, session}
let unsent = [];       // the turns the person has said since the last request

// Every session starts its own timeline at zero. Comparing a fragment against
// a turn from an earlier session therefore compares two different clocks, and
// the difference comes out negative — which passed a "small enough gap" test
// and welded a new conversation onto the end of the last one.
let session = 0;

// Machine names are for machines. Every row a person reads says what happened
// in words they did not have to learn.
const PLAINLY = {
  "run.asked": "Passed on to the agents",
  "tool.started": (e) => `Running ${e.tool ?? "a tool"}`,
  "tool.completed": (e) => `Finished ${e.tool ?? "that"}`,
  "run.completed": "Done",
  "run.failed": "That went wrong",
  "approval.request": "Waiting for your permission",
  "approval.requested": "Waiting for your permission",
  "approval.resolved": "You answered",
  "watch.lost": "Lost track of that one",
  "voice.told": "The voice has it",
  "voice.unheard": "The voice did not confirm — saying it again",
  "voice.lost": "The voice never took it",
  "error": "Something went wrong",
};

const plainly = (e) => {
  const said = PLAINLY[e.event];
  if (typeof said === "function") return said(e);
  return said ?? e.event ?? "";
};

// A conversation reads downwards. So does a list of what an agent did, which
// is why both append and neither reverses.
const show = (who, text) => {
  const row = document.createElement("div");
  row.className = "turn";
  row.dataset.who = who;
  row.innerHTML = `<div class="who"></div><div class="what"></div>`;
  row.querySelector(".who").textContent = who;
  row.querySelector(".what").textContent = text;
  log.append(row);
  row.scrollIntoView({ block: "nearest" });
  return row;
};

const keep = (turn) => fetch("/turn", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ who: turn.who, text: turn.text }),
}).catch(() => {});

// A fragment either continues the turn it belongs to or starts a new one.
function heard(who, delta, startMs, endMs) {
  if (!delta) return;
  const last = turns.findLast((turn) => turn.who === who && turn.session === session);
  const gap = last && startMs != null && last.end != null ? startMs - last.end : null;
  // A gap below zero means the clocks do not agree, never that no time passed.
  const continues = gap != null ? gap >= 0 && gap <= TURN_GAP_MS : Boolean(last);
  if (continues) {
    last.text += delta;
    last.end = endMs ?? last.end;
    last.row.querySelector(".what").textContent = last.text;
    last.row.scrollIntoView({ block: "nearest" });
    clearTimeout(last.settle);
    last.settle = setTimeout(() => keep(last), TURN_GAP_MS + 400);
    return last;
  }
  const fresh = { who, text: delta, start: startMs, end: endMs, session, row: show(who, delta) };
  turns.push(fresh);
  // A turn is kept by the bridge, not by this page: a page forgets on reload,
  // and the bridge is what a new session asks for its history.
  clearTimeout(fresh.settle);
  fresh.settle = setTimeout(() => keep(fresh), TURN_GAP_MS + 400);
  return fresh;
}

const send = (event) => {
  if (channel?.readyState !== "open") return false;
  channel.send(JSON.stringify(event));
  return true;
};

// One line in the panel, and one line the bridge can keep. What the voice does
// with an answer happens out here, past where the bridge can see, so the only
// record of it is the one this page sends back.
const noticed = (event, detail) => fetch("/noticed", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ event, detail }),
}).catch(() => {});

// Handing the voice an answer is not the same as the voice receiving it. Each
// append is acknowledged with the event_id it was sent under, and that
// acknowledgement is the only sign this page gets. Without watching for it, an
// answer that never arrived looks exactly like an answer that arrived and was
// not spoken — which is the shape the trouble actually took: the right answer
// on screen, and a voice that plainly did not have it.
//
// So every append goes through here, is waited for, and is said once more if
// nothing comes back.
const APPEND = {
  // Spoken: the model paraphrases it aloud.
  commentary: "session.commentary.append",
  // Not spoken: something the model should simply know.
  thinking: "session.thinking.append",
};
const ACKNOWLEDGED_WITHIN_MS = 2500;
const unacknowledged = new Map();
const said = new Map();
let appends = 0;

// The channel opens a moment after it is created, and the first thing there is
// to say can arrive inside that moment: the browser can return a position
// before the handshake finishes. Dropping it there would lose exactly the fact
// this was built to deliver, so it waits instead.
const WAITING_TO_BE_SAID = 8;
let queued = [];

function append(kind, delegationId, content, again = true) {
  if (!content) return;
  if (channel?.readyState !== "open") {
    if (queued.length < WAITING_TO_BE_SAID) queued.push(() => append(kind, delegationId, content, again));
    return;
  }
  const id = `c${(appends += 1)}_${Date.now()}`;
  if (!send({ type: APPEND[kind], event_id: id, delegation_id: delegationId, content })) return;
  said.set(id, content);
  unacknowledged.set(id, setTimeout(() => {
    unacknowledged.delete(id);
    said.delete(id);
    if (again) {
      noticed("voice.unheard", content);
      append(kind, delegationId, content, false);
    } else {
      noticed("voice.lost", content);
    }
  }, ACKNOWLEDGED_WITHIN_MS));
}

const tell = (delegationId, content) => append("commentary", delegationId, content);

// A fact the voice should have and not read out. Where the person is arrives
// this way rather than as an answer, because "do you have my position" is a
// question about itself, and it answers those without asking anybody.
const think = (content) => append("thinking", null, content);

function acknowledged(eventId) {
  const waiting = unacknowledged.get(eventId);
  if (waiting === undefined) return;
  clearTimeout(waiting);
  unacknowledged.delete(eventId);
  noticed("voice.told", said.get(eventId) ?? "");
  said.delete(eventId);
}

// The model asks for help with an identifier and no task text: what was wanted
// lives in the transcript we have been keeping. docs/voice-contract.md.
async function answer(delegationId) {
  const transcript = unsent.map((t) => t.text.trim()).filter(Boolean).join("\n");
  unsent = [];
  // Work can take ten seconds or more, and silence sounds like a dropped call,
  // so the voice says it is on it. But the bridge now answers the clock, the
  // budget and where you are in under a millisecond, and "I'm on it" followed
  // in the same breath by the answer is not a progress report — it is two
  // things to say at once. So the holding line waits to find out whether there
  // is any waiting to cover.
  let settled = false;
  if (holding) setTimeout(() => settled || tell(delegationId, holding), HOLD_AFTER_MS);
  let content, runId = null, finished = true;
  try {
    const reply = await fetch("/delegation", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ transcript }),
    });
    const body = await reply.json();
    content = reply.ok ? body.content : `I could not do that: ${body.error}`;
    ({ run_id: runId, finished } = body);
  } catch (failure) {
    content = `The bridge did not answer: ${failure.message}`;
  }
  settled = true;
  offer(note("Answer from the agents", content), content);
  tell(delegationId, content);
  if (!finished && runId) waitOn(runId, delegationId);
}

function onEvent(event) {
  switch (event.type) {
    case "session.input_transcript.delta": {
      const turn = heard("You", event.delta, event.start_ms, event.end_ms);
      // Each turn is sent as itself. Gluing them together made one request out
      // of a question and an answer to a different one.
      if (turn && !unsent.includes(turn)) unsent.push(turn);
      break;
    }
    case "session.output_transcript.delta":
      // The voice answering is the turn being finished. Whatever was said
      // before it has been dealt with, and must not ride along with the next
      // request — ten turns of small talk once reached the agents as one
      // confused instruction because nothing cleared this.
      if (unsent.length) unsent = [];
      heard("It said", event.delta, event.start_ms, event.end_ms);
      break;
    case "session.delegation.created": answer(event.delegation.id); break;
    case "session.commentary.appended":
    case "session.thinking.appended":
    case "session.instructions.appended": acknowledged(event.event_id); break;
    case "error": note("Something went wrong", event.error?.message ?? "unknown"); break;
  }
}

// The gateway streams every tool an agent starts and every token it writes.
// The voice plane must not read that out; this is where it goes instead.
// The agents sometimes answer with choices — "1) start here 2) start there",
// or a line asking for an exact phrase. Those are unsayable, and asking them
// not to only half works, so anything that looks like a choice also becomes
// something you can tap.
const CHOICE = /(?:^|\n)\s*(?:\d[).]|[-*\u2022])\s*(.{3,80}?)\s*(?=\n|$)/g;
const QUOTED = /[«"\u201c]([^»"\u201d\n]{3,60})[»"\u201d]/g;

function choices(text) {
  const found = [...text.matchAll(CHOICE)].map((m) => m[1]);
  return (found.length >= 2 ? found : [...text.matchAll(QUOTED)].map((m) => m[1])).slice(0, 6);
}

function offer(row, content) {
  const options = choices(content ?? "");
  if (options.length < 1) return;
  const buttons = document.createElement("div");
  buttons.className = "answer";
  for (const option of options) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = option.length > 40 ? `${option.slice(0, 38)}…` : option;
    button.title = option;
    button.onclick = () => {
      buttons.remove();
      show("You", option);
      answerWith(option);
    };
    buttons.append(button);
  }
  buttons.style.flexWrap = "wrap";
  row.append(buttons);
}

// Tapping a choice says it, exactly, without anybody having to pronounce it.
async function answerWith(text) {
  const reply = await fetch("/delegation", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ transcript: text }),
  }).then((r) => r.json()).catch((f) => ({ content: String(f) }));
  const row = note("Answer from the agents", reply.content ?? reply.error ?? "");
  offer(row, reply.content);
  tell(null, reply.content ?? "");
  if (reply.finished === false && reply.run_id) waitOn(reply.run_id, null);
}

// A permission question is the one row you can answer. Buttons here and a
// spoken yes or no do the same thing, and the gateway only ever gets "once" or
// "deny" — never a standing permission. ADR-VI-003.
function asking(row, event) {
  row.dataset.asking = "yes";
  const command = String(event.approval?.command ?? event.command ?? event.preview ?? "");
  if (command) row.querySelector(".what").textContent = command.split("\n").find((l) => l.trim()) ?? command;
  const buttons = document.createElement("div");
  buttons.className = "answer";
  for (const [label, choice] of [["Allow once", "once"], ["Refuse", "deny"]]) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.onclick = async () => {
      buttons.remove();
      delete row.dataset.asking;
      const reply = await fetch("/approval", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ choice }),
      }).then((r) => r.json()).catch((f) => ({ content: String(f) }));
      note(label, reply.content ?? reply.error ?? "");
      tell(null, reply.content ?? "");
    };
    buttons.append(button);
  }
  row.append(buttons);
}

// Work can take minutes. Asking the person to come back and ask again is not
// an interface; the answer arrives on its own, as another append continuing the
// same delegation, which is what the guide allows repeated appends for.
const LONGEST_WAIT_MS = 15 * 60 * 1000;

async function waitOn(runId, delegationId) {
  const until = Date.now() + LONGEST_WAIT_MS;
  while (Date.now() < until) {
    let body;
    try {
      body = await fetch("/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ run_id: runId }),
      }).then((r) => r.json());
    } catch {
      return;
    }
    if (body.finished) {
      offer(note("Answer from the agents", body.content), body.content);
      tell(delegationId, body.content);
      return;
    }
  }
  note("Gave up waiting", "still running after fifteen minutes");
}

// One row in the panel underneath, in words rather than event names.
function note(kind, detail) {
  const row = document.createElement("div");
  row.className = "ev";
  row.innerHTML = `<div class="kind"></div><div class="what"></div>`;
  row.querySelector(".kind").textContent = kind;
  row.querySelector(".what").textContent = detail ?? "";
  under.append(row);
  while (under.children.length > 300) under.firstElementChild.remove();
  row.scrollIntoView({ block: "nearest" });
  return row;
}

function watch() {
  const stream = new EventSource("/watch");
  let writing = null;
  stream.onmessage = (m) => {
    let e;
    try { e = JSON.parse(m.data); } catch { return; }
    if (e.event === "message.delta") {
      if (!writing) writing = note("Writing the answer", "");
      writing.querySelector(".what").textContent += e.delta ?? "";
      return;
    }
    writing = null;
    const detail = e.asked ?? e.preview ?? e.why ?? e.detail ?? "";
    const row = note(plainly(e), String(detail));
    row.dataset.kind = e.event ?? "";
    if (e.event === "approval.request") asking(row, e);
  };
  stream.onerror = () => { /* the browser reconnects on its own */ };
}
watch();

async function start() {
  state.textContent = "opening";
  session += 1;
  if (session > 1) {
    const rule = document.createElement("div");
    rule.className = "newer";
    rule.textContent = "new session";
    log.append(rule);
  }
  holding = await fetch("/config").then((r) => r.json()).then((c) => c.holding).catch(() => "");
  // Echo cancellation is the browser's, and it is the whole reason this is a
  // page rather than a program: ADR-VI-018.
  const mic = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });

  pc = new RTCPeerConnection();
  pc.ontrack = (e) => { const a = new Audio(); a.srcObject = e.streams[0]; a.autoplay = true; };
  pc.addTrack(mic.getTracks()[0], mic);

  channel = pc.createDataChannel("oai-events");
  channel.onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch { /* not ours */ } };
  channel.onopen = () => queued.splice(0).forEach((waiting) => waiting());

  await pc.setLocalDescription(await pc.createOffer());
  await new Promise((done) => {
    if (pc.iceGatheringState === "complete") return done();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === "complete" && done();
  });

  const reply = await fetch("/session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp: pc.localDescription.sdp }),
  });
  const body = await reply.json();
  if (!reply.ok) throw new Error(body.error ?? "the bridge refused");
  await pc.setRemoteDescription({ type: "answer", sdp: body.sdp });
  if (body.resumed) note("Picked up where you left off", `${body.resumed} turns`);

  state.textContent = "listening";
  talk.textContent = "Put it down";
  talk.dataset.live = "yes";
  booked = Date.now();
  booking = setInterval(book, BOOK_EVERY_MS);
  // Asked once per session, when the microphone is taken — a person who has
  // just opted into being listened to is in the right frame for this question,
  // and asking on page load is not. Declining is answered honestly rather than
  // guessed at, and the coordinates never leave the bridge's memory.
  navigator.geolocation?.getCurrentPosition(
    ({ coords }) => fetch("/where", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ latitude: coords.latitude, longitude: coords.longitude }),
    }).then((r) => r.json()).then((p) => {
      if (!p.placed) return;
      note("Where you are", p.placed);
      think(p.known);
    }).catch(() => {}),
    () => {},
    { maximumAge: 600_000, timeout: 8_000 },
  );
  addEventListener("pagehide", book, { once: true });
}

function stop() {
  book();
  queued = [];
  clearInterval(booking);
  booked = booking = null;
  pc?.close();
  pc = channel = null;
  state.textContent = "idle";
  talk.textContent = "Take the microphone";
  delete talk.dataset.live;
}

talk.onclick = async () => {
  if (pc) return stop();
  try { await start(); } catch (failure) { stop(); state.textContent = failure.message; }
};
</script>
